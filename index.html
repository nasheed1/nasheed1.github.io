<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>নাশিদ লাইব্রেরি · Nasheed Library</title>
<meta name="description" content="Free and open-source apps for Android and PC by Nasheed.">
<meta name="theme-color" content="#160709">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📕%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#160709; --bg2:#1f0b0e; --line:#3a1319; --ink:#f6e9e7; --mute:#b99a98;
  --red:#e11d3f; --red2:#ff4d68; --deep:#7a0f21;
  --sans:"Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,sans-serif;
  --disp:"Fraunces","Hind Siliguri",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--sans);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background-image:radial-gradient(900px 420px at 85% -80px,rgba(225,29,63,.28),transparent 70%)}
a{color:inherit}
:focus-visible{outline:2px solid var(--red2);outline-offset:3px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{font:800 18px var(--disp);letter-spacing:.2px;text-decoration:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:6px 16px;font-size:15px;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--red);color:#fff}
.hero{padding:56px 0 44px}
.hero h1{margin:0;font:800 clamp(46px,11vw,96px)/1.08 var(--disp);letter-spacing:-.02em}
.hero h1 small{display:block;margin-top:10px;font:500 clamp(20px,4vw,30px) var(--disp);color:var(--red2);letter-spacing:0}
.hero p{max-width:34em;margin:22px 0 0;color:var(--mute);font-size:19px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 26px}
.chip{all:unset;cursor:pointer;padding:7px 18px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:16px}
.chip:hover{border-color:var(--red)}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.shelf{display:grid;gap:14px;padding-bottom:10px}
.book{display:grid;grid-template-columns:18px 1fr;background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.spine{background:linear-gradient(180deg,var(--red),var(--deep));box-shadow:inset -3px 0 0 rgba(0,0,0,.25)}
.book:nth-child(3n+2) .spine{background:linear-gradient(180deg,#b3122e,#4a0912)}
.book:nth-child(3n) .spine{background:linear-gradient(180deg,#ff4d68,#9b1530)}
.body{padding:22px 24px 24px}
.body h2{margin:0;font:700 28px/1.3 var(--sans)}
.body h2 span{display:block;font:600 15px var(--disp);color:var(--mute)}
.body p{margin:12px 0 16px;max-width:38em}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tag{padding:2px 12px;border-radius:6px;background:rgba(225,29,63,.14);color:var(--red2);font-size:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:9px 20px;border-radius:8px;border:1px solid var(--line);text-decoration:none;font-weight:500}
.btn:hover{border-color:var(--red2)}
.btn.main{background:var(--red);border-color:var(--red);color:#fff}
.btn.main:hover{background:var(--red2);border-color:var(--red2)}
.empty{padding:40px 0;color:var(--mute)}
.more{margin:10px 0 0;padding:22px 24px;border:1px dashed var(--line);border-radius:10px;color:var(--mute)}
footer{margin-top:56px;padding:26px 0 40px;border-top:1px solid var(--line);color:var(--mute);font-size:15px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:520px){.body{padding:18px 16px 20px}.body h2{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.book{transition:border-color .2s}.book:hover{border-color:var(--red)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#">Nasheed Library</a>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="bn" aria-pressed="true">বাংলা</button>
      <button data-l="en" aria-pressed="false">English</button>
    </div>
  </header>

  <section class="hero">
    <h1><span data-t="title">নাশিদ লাইব্রেরি</span><small>Nasheed Library</small></h1>
    <p data-t="lead"></p>
  </section>

  <div class="bar" role="group" aria-label="Filter" id="bar"></div>
  <main class="shelf" id="shelf" aria-live="polite"></main>
  <div class="more" data-t="more"></div>

  <footer>
    <span data-t="foot"></span>
    <a href="https://github.com/nasheed1" rel="noopener">GitHub · nasheed1</a>
  </footer>
</div>

<script>
// Fallback copy of apps.json, used if the file cannot be loaded (for example when opened from disk).
var FALLBACK=[{id:"nijashwa-studio",name:{bn:"নিজস্ব স্টুডিও",en:"Nijashwa Studio"},desc:{bn:"অফলাইন ভিডিও এডিটর। টাইমলাইন, বাংলা টেক্সট, ট্রানজিশন, ইফেক্ট ও MP4 এক্সপোর্ট। সার্ভার বা অ্যাকাউন্ট লাগে না।",en:"An offline video editor with timeline, Bengali text, transitions, effects and MP4 export. No server or account needed."},tags:["android","pc"],links:{web:"https://nasheed1.github.io/nijashwa-studio/",apk:"https://github.com/nasheed1/nijashwa-studio/releases/latest",source:"https://github.com/nasheed1/nijashwa-studio"}}];

var T={
  bn:{title:"নাশিদ লাইব্রেরি",
      lead:"আমার বানানো সব ওপেন সোর্স অ্যাপ এক তাকে। মোবাইল ও PC দুটোর জন্যই, সবই বিনা মূল্যে।",
      all:"সব",android:"Android",pc:"PC",web:"ওয়েব",
      apk:"APK ডাউনলোড",webOpen:"ব্রাউজারে চালাও",pcDl:"PC-র জন্য ডাউনলোড",src:"সোর্স কোড",
      empty:"এই ধরনের কোনো অ্যাপ এখনও নেই।",
      more:"আরও অ্যাপ আসছে। নতুন অ্যাপ বানালেই এখানে যোগ হবে।",
      foot:"সব অ্যাপ MIT লাইসেন্সে ওপেন সোর্স।"},
  en:{title:"নাশিদ লাইব্রেরি",
      lead:"Every open-source app I build, on one shelf. For phone and PC, all free.",
      all:"All",android:"Android",pc:"PC",web:"Web",
      apk:"Download APK",webOpen:"Open in browser",pcDl:"Download for PC",src:"Source code",
      empty:"No apps of this kind yet.",
      more:"More apps are on the way. New ones will be added here as I build them.",
      foot:"All apps are open source under the MIT license."}
};
var apps=[],lang="bn",filter="all";
try{lang=localStorage.getItem("nl-lang")||"bn"}catch(e){}

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function link(cls,text,href){var a=el("a","btn "+cls,text);a.href=href;a.rel="noopener";return a}

function render(){
  var t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(function(n){n.textContent=t[n.dataset.t]});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang)});

  var bar=document.getElementById("bar");bar.textContent="";
  ["all","android","pc","web"].forEach(function(k){
    var c=el("button","chip",t[k]);c.setAttribute("aria-pressed",k===filter);
    c.onclick=function(){filter=k;render()};bar.appendChild(c);
  });

  var shelf=document.getElementById("shelf");shelf.textContent="";
  var list=apps.filter(function(a){return filter==="all"||(a.tags||[]).indexOf(filter)>-1});
  if(!list.length){shelf.appendChild(el("div","empty",t.empty));return}
  list.forEach(function(a){
    var book=el("article","book"),body=el("div","body");
    book.appendChild(el("div","spine"));
    var h=el("h2",null,a.name[lang]);
    if(lang==="bn"&&a.name.en)h.appendChild(el("span",null,a.name.en));
    if(lang==="en"&&a.name.bn)h.appendChild(el("span",null,a.name.bn));
    body.appendChild(h);
    body.appendChild(el("p",null,a.desc[lang]));
    var tags=el("div","tags");
    (a.tags||[]).forEach(function(k){tags.appendChild(el("span","tag",t[k]||k))});
    body.appendChild(tags);
    var acts=el("div","acts"),L=a.links||{};
    if(L.apk)acts.appendChild(link("main",t.apk,L.apk));
    if(L.web)acts.appendChild(link("main",t.webOpen,L.web));
    if(L.pc)acts.appendChild(link("",t.pcDl,L.pc));
    if(L.source)acts.appendChild(link("",t.src,L.source));
    body.appendChild(acts);book.appendChild(body);shelf.appendChild(book);
  });
}

document.querySelectorAll(".lang button").forEach(function(b){
  b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem("nl-lang",lang)}catch(e){}render()}
});

fetch("apps.json").then(function(r){if(!r.ok)throw 0;return r.json()})
  .catch(function(){return FALLBACK})
  .then(function(d){apps=d;render()});
</script>
</body>
</html>
